name: CI / Publish Artifact

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend / Integration Tests
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore VocabularyApp.sln

      # No filter: this project includes unit, service, and integration tests.
      # The existing fixtures replace SQL Server with private in-memory SQLite.
      - name: Run backend and integration tests
        run: dotnet test VocabularyApp.WebApi.Tests/VocabularyApp.WebApi.Tests.csproj --configuration Release --no-restore

  frontend-tests:
    name: Frontend Tests
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: VocabularyApp.UI
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: VocabularyApp.UI/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests with headless Chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

  build:
    name: Build / Publish Artifact
    needs: [backend-tests, frontend-tests]
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: VocabularyApp.UI/package-lock.json
      - name: Restore solution
        run: dotnet restore VocabularyApp.sln
      - name: .NET API Release build
        run: dotnet build VocabularyApp.sln --configuration Release --no-restore
      - name: Install frontend dependencies
        working-directory: VocabularyApp.UI
        run: npm ci
      - name: Angular production build
        working-directory: VocabularyApp.UI
        run: npm run build -- --configuration production
      # Stage browser assets before publishing so the Web SDK includes them.
      - name: Stage Angular browser contents in API wwwroot
        shell: pwsh
        run: |
          $browserOutput = Join-Path $env:GITHUB_WORKSPACE 'VocabularyApp.UI/dist/vocabulary-app.ui/browser'
          $staticRoot = Join-Path $env:GITHUB_WORKSPACE 'VocabularyApp.WebApi/wwwroot'
          if (-not (Test-Path -LiteralPath (Join-Path $browserOutput 'index.html') -PathType Leaf)) {
            throw 'Angular browser output is missing index.html.'
          }
          New-Item -ItemType Directory -Path $staticRoot -Force | Out-Null
          Get-ChildItem -LiteralPath $browserOutput -Force |
            Where-Object { $_.Name -ne 'web.config' } |
            Copy-Item -Destination $staticRoot -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $staticRoot 'index.html') -PathType Leaf)) {
            throw 'API wwwroot is missing the staged Angular index.html.'
          }
          if (Get-ChildItem -LiteralPath $staticRoot -Filter web.config -Recurse -Force) {
            throw 'Angular IIS configuration must not be staged in API wwwroot.'
          }
      - name: Test Release A artifact and acceptance checks offline
        shell: pwsh
        run: ./scripts/ci/tests/Test-Psh1Scripts.ps1
      - name: Publish and validate application package
        id: publish
        shell: pwsh
        run: ./scripts/ci/Publish-VocabularyApp.ps1
      - name: Verify actual published HTTPS policy and mutation rejection
        shell: pwsh
        env:
          PSH1_PUBLISH_DIRECTORY: ${{ steps.publish.outputs.publish-directory }}
        run: ./scripts/ci/tests/Test-Psh1Scripts.ps1 -PublishedWebConfig (Join-Path $env:PSH1_PUBLISH_DIRECTORY 'web.config')
      - name: Upload validated application package
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: VocabularyApp-SmarterASP-Publish-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.publish.outputs.publish-directory }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  deploy-production:
    name: Deploy to SmarterASP.NET
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: vocabularyapp-production
      cancel-in-progress: false
    steps:
      - name: Check out deployment script from the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Prepare clean artifact staging directory
        id: staging
        shell: pwsh
        env:
          PUBLISH_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PUBLISH_ARTIFACT_ID -notmatch '^[1-9][0-9]*$') {
            throw 'The successful build did not supply a valid artifact ID.'
          }
          $directory = Join-Path $env:RUNNER_TEMP ('VocabularyApp-deploy-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $directory | Out-Null
          "directory=$directory" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Download the validated artifact from this workflow run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ steps.staging.outputs.directory }}
          digest-mismatch: error
      - name: Validate package and deploy with Microsoft Web Deploy
        shell: pwsh
        env:
          DEPLOY_DIRECTORY: ${{ steps.staging.outputs.directory }}
          SMARTERASP_WEBDEPLOY_URL: ${{ vars.SMARTERASP_WEBDEPLOY_URL }}
          SMARTERASP_WEBDEPLOY_USERNAME: ${{ vars.SMARTERASP_WEBDEPLOY_USERNAME }}
          SMARTERASP_SITE_NAME: ${{ vars.SMARTERASP_SITE_NAME }}
          SMARTERASP_WEBDEPLOY_PASSWORD: ${{ secrets.SMARTERASP_WEBDEPLOY_PASSWORD }}
        run: ./scripts/ci/Deploy-SmarterAsp.ps1
      - name: Accept Release A production HTTPS transport (HSTS deferred)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/Test-ProductionHttps.ps1
